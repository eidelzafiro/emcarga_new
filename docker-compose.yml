services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: emcarga-app
    restart: unless-stopped
    tty: true
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      REDIS_PORT: 6379
      LEGACY_DB_CONNECTION: mysql
      LEGACY_DB_HOST: mysql
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: emcarga
      LEGACY_DB_USERNAME: root
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-secret}
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - emcarga-network
    depends_on:
      - mysql

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: emcarga-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www
    networks:
      - emcarga-network
    depends_on:
      - app

  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: emcarga-mysql
    restart: unless-stopped
    tty: true
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-emcarga_new}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - emcarga-mysql-data:/var/lib/mysql/
    networks:
      - emcarga-network

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: emcarga-reverb
    restart: unless-stopped
    tty: true
    ports:
      - "${REVERB_EXTERNAL_PORT:-8080}:${REVERB_SERVER_PORT:-8080}"
    command: php artisan reverb:start --debug
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-emcarga_new}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_PORT: ${REVERB_PORT:-8081}
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - emcarga-network
    depends_on:
      - redis
      - mysql

  redis:
    image: redis:alpine
    container_name: emcarga-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - emcarga-network

networks:
  emcarga-network:
    driver: bridge

volumes:
  emcarga-mysql-data:
    driver: local
